schema: spec-driven

context: |
  castorterm is an open source, GPU-accelerated terminal for agentic coding, written in Rust.
  UI framework: GPUI. Terminal state: alacritty_terminal. PTY: portable-pty (ConPTY on Windows).
  Designs and tasks must cover Windows (first-class), macOS and Linux.
  Write all artifacts in English (public open source project).
  Domain model: Workspace -> Project (repo or git worktree) -> Session (agent or shell, one PTY).
  Keep memory footprint low: no webviews, no Electron, no telemetry.

rules:
  proposal:
    - Always state what is out of scope
  tasks:
    - Every task that adds behaviour includes its tests
