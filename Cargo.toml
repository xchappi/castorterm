[package]
name = "castorterm"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "A GPU-accelerated terminal for agentic coding: workspaces, projects and agent sessions side by side."
license = "MIT OR Apache-2.0"
repository = "https://github.com/xchappi/castorterm"
readme = "README.md"
keywords = ["terminal", "ai", "agents", "gpui"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
alacritty_terminal = "0.26.0"
anyhow = "1"
futures = "0.3"
gpui = "0.2.2"

# Compile Metal shaders at runtime: avoids requiring the full Xcode Metal toolchain.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

[profile.release]
lto = "thin"
codegen-units = 1
