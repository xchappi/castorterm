# castorterm configuration example.
#
# Location:
#   Windows:      %APPDATA%\castorterm\config.toml
#   macOS/Linux:  $XDG_CONFIG_HOME/castorterm/config.toml (default ~/.config/castorterm/config.toml)
# Set CASTORTERM_CONFIG to use another file. Every section is optional.
# Workspaces and projects can also be created from the window (+ Workspace,
# +, drag and drop); castorterm then updates this file and keeps comments.

[font]
family = "Cascadia Mono"
size = 14

[ui]
# CRT-style scanlines over the terminal.
scanlines = true
# Reopen the sessions of the last run at startup (sessions.json next to
# this file). Agents get their resume_args.
restore_sessions = true

# Agent launchers. Each one opens your shell in the project directory and
# types `command` into it, so the shell stays open when the agent exits.
# The command lands in your shell history: do not put API keys in it, use
# environment variables instead.
[[agents]]
name = "Claude Code"
command = "claude"
# Optional: how to pass a task as the initial prompt (Quests tab).
task_args = ["{prompt}"]
# Optional: added when the session is restored at startup, to continue the
# last conversation in that folder instead of starting a new one.
resume_args = ["--continue"]

[[agents]]
name = "OpenCode"
command = "opencode"

# Task providers for the Quests tab (see docs/providers.md).
[[providers]]
name = "github"
command = "github_issues_provider"

# Workspaces group projects in the sidebar. Paths must be absolute; a
# leading ~ is expanded to your home directory.

[[workspaces]]
name = "CastorLabs"
# The board lists the tasks of every project below that has a `repo`.
board = { provider = "github", prompt = "Work on task {id}: {title}", refresh_secs = 60 }

[[workspaces.projects]]
name = "castorterm"
path = "~/src/castorterm"
repo = "xchappi/castorterm"

[[workspaces.projects]]
name = "website"
path = "~/src/website"
